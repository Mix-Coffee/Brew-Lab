  #      - dark-blue
  #      - photon-dark
  #      - boxy-light
  #      - gruvbox-dark
  #
  #   theme      = ""
  # 

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #  
  # Addon: Social icons
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #
  [[params.social]]
    name = "telegram"
    url  = "https://telegram.org/"

  [[params.social]]
    name = "email"
    url  = "mailto:mix.coffee.dev@gmail.com"

  [[params.social]]
    name = "github"
    url  = "https://github.com/Mix-Coffee"

[menu]
  # Cheese-Lib:先占位(weight 0 → 排在"博客"前面)
  [[menu.main]]
    identifier = "0-cheese-lib"
    weight     = 0
    name       = "Cheese-Lib"
    url        = "cheese-lib/"
  [[menu.main]]
    identifier  = "2-about"
    weight      = 2
    name        = "关于"
    url         = "about/"
    hasChildren = true
  
  [[menu.main]]
    identifier  = "me"
    name        = "Blogger"
    url         = "about/me/"
    parent      = "2-about"

  [[menu.main]]
    identifier = "1-posts"
    weight     = 1
    name       = "Posts"
    url        = "posts/"
